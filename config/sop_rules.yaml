# SOP / Policy Rule Definitions
# Every rule below maps 1:1 to a check function in src/checks/.
eta:
  eta_deviation_threshold_pct: 15
  eta_deviation_severity: "HIGH"
  invalid_eta_severity: "CRITICAL"
traffic:
  valid_flow_tags: ["free_flow", "moderate", "heavy", "closed"]
  invalid_tag_severity: "MEDIUM"
  closed_road_with_eta_severity: "HIGH"
lanes:
  valid_directionality: ["forward", "backward", "bidirectional"]
  missing_directionality_severity: "HIGH"
  require_connectivity_unless_tagged: "dead_end"
  disconnected_segment_severity: "CRITICAL"
  min_lane_count: 1
  max_lane_count: 8
  lane_count_severity: "MEDIUM"
places:
  required_fields: ["name", "category", "lat", "lon", "address"]
  missing_field_severity: "MEDIUM"
  lat_range: [-90, 90]
  lon_range: [-180, 180]
  bad_coordinate_severity: "CRITICAL"
  duplicate_distance_meters: 50
  duplicate_severity: "MEDIUM"
reporting:
  sla_hours_per_batch: 4
  weekly_report_dir: "reports"
  history_file: "reports/history.csv"
